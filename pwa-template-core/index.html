<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌍 PWA Flag Core</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#FDFDFA">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>

<h1>🌍 Học Cờ Quốc Gia</h1>

<div id="sync-container" style="display: none;">
    <div class="sync-info">
        <span id="sync-status">Đang đồng bộ dữ liệu...</span>
        <span id="sync-percentage">0%</span>
    </div>
    <div class="progress-bar">
        <div id="progress-fill"></div>
    </div>
</div>

<div class="lang-switch">
    <button id="btn-vi" class="active" onclick="setLang('vi')">🔊 Nghe tiếng Việt</button>
    <button id="btn-en" onclick="setLang('en')">🔊 Nghe tiếng Anh</button>
</div>

<button class="acc-btn">🌏 Châu Á</button>
<div class="acc-content"><div class="grid" id="asia"></div></div>

<button class="acc-btn">🌍 Châu Âu</button>
<div class="acc-content"><div class="grid" id="europe"></div></div>

<button class="acc-btn">🌍 Châu Phi</button>
<div class="acc-content"><div class="grid" id="africa"></div></div>

<button class="acc-btn">🌎 Bắc Mỹ</button>
<div class="acc-content"><div class="grid" id="north-america"></div></div>

<button class="acc-btn">🌎 Nam Mỹ</button>
<div class="acc-content"><div class="grid" id="south-america"></div></div>

<button class="acc-btn">🌊 Châu Đại Dương</button>
<div class="acc-content"><div class="grid" id="oceania"></div></div>

<div class="guide">
    <span>👉 Bấm tiêu đề để mở / đóng</span>
    <span>🔊 Bấm lá cờ để nghe phát âm</span>
</div> 

<footer class="footer-nav">
    <a href="install.html" class="install-link">Hướng dẫn cài đặt <span>➔</span></a>
</footer>

<script type="module" src="main.js"></script>

<script>
    // Đăng ký Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js')
                .catch(err => console.log('SW registration failed: ', err));
        });
    }

    // Yêu cầu quyền lưu trữ bền vững (Storage Persistence)
    if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().then(persistent => {
            if (persistent) console.log("Storage will not be cleared except by explicit user action");
        });
    }
</script>
</body>
</html>
